# GENERATED by oxeegen/scripts/gen-managed.py from plugins/model-providers/oxeegen/oxeegen.json — do not edit.
#
# Oxeegen Hermes managed scope: values the app cannot change. The region is the endpoint in
# OXEEGEN_BASE_URL (.env, written with OXEEGEN_API_KEY by the Oxeegen settings); references
# left unresolved stay verbatim, so a missing region fails instead of reaching another endpoint.

model:
  provider: oxeegen
  default: oxeegen-default

# No second source of inference: no fallbacks, no custom endpoints, no other provider.
fallback_providers: []
custom_providers: []
model_catalog:
  enabled: false
  allowed_providers: [oxeegen]

# Voice goes to Oxeegen's OpenAI-compatible audio API with the same key and region.
stt:
  provider: openai
  openai:
    api_key: "${OXEEGEN_API_KEY}"
    base_url: "${OXEEGEN_BASE_URL}"
    model: whisper-1
tts:
  provider: openai
  openai:
    api_key: "${OXEEGEN_API_KEY}"
    base_url: "${OXEEGEN_BASE_URL}"
    model: tts-1
    voice: alloy

# Nothing is reported to Nous.
telemetry:
  shared_metrics:
    enabled: false
    send: false
