tts:
  provider: openai
  openai:
    api_key: "${OXEEGEN_API_KEY}"
    base_url: "${OXEEGEN_BASE_URL}"
    model: voxee-tts-pro
    voice: alloy

# Nothing is reported to Nous.
telemetry:
  shared_metrics:
    enabled: false
    send: false
